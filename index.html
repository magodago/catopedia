<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catopedia</title>
<style>
body { background: #080013; color: #e8e0ff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
h1 { color: #00d4ff; text-align: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
.card { background: #0d0020; border: 1px solid #1a0040; border-radius: 12px; padding: 15px; }
.card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
.card h3 { color: #00d4ff; margin: 10px 0 5px; }
.card p { color: #8b7baa; font-size: 0.85em; margin: 3px 0; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.7em; margin-right: 5px; background: rgba(0,212,255,0.15); color: #00d4ff; }
#count { text-align: center; color: #6b5b8a; margin: 10px 0; }
</style>
</head>
<body>
<h1>Catopedia - Razas de Gatos</h1>
<p id="count">Cargando...</p>
<div class="grid" id="grid"></div>

<script>
var breeds = [
  {id:"siames",name:"Siamés",origin:"Tailandia",type:"pelo-corto",desc:"Una de las razas más antiguas. Vocales, inteligentes y leales.",img:"https://images.unsplash.com/photo-1611915387289-08be07d7ce0d?w=400&h=300&fit=crop",weight:"3-5 kg",lifespan:"12-20 años"},
  {id:"persa",name:"Persa",origin:"Irán",type:"pelo-largo",desc:"El epítome del lujo felino. Pelaje exuberante y temperamento tranquilo.",img:"https://images.unsplash.com/photo-1574158622682-e40e69881006?w=400&h=300&fit=crop",weight:"3.5-7 kg",lifespan:"12-17 años"},
  {id:"maine-coon",name:"Maine Coon",origin:"EE.UU",type:"pelo-largo",desc:"El gigante gentil. La raza doméstica más grande, superando los 10 kg.",img:"https://images.unsplash.com/photo-1600800634599-33c45ac98d48?w=400&h=300&fit=crop",weight:"5-11 kg",lifespan:"12-15 años"},
  {id:"bengali",name:"Bengalí",origin:"EE.UU",type:"pelo-corto",desc:"Un leopardo en miniatura. Pelaje moteado espectacular y energía infinita.",img:"https://images.unsplash.com/photo-1591946614720-90e1a156f8da?w=400&h=300&fit=crop",weight:"4-7 kg",lifespan:"12-16 años"},
  {id:"sphynx",name:"Sphynx",origin:"Canadá",type:"sin-pelo",desc:"El gato sin pelo más famoso. Piel cálida como gamuza.",img:"https://images.unsplash.com/photo-1606214174790-dd4a9a1b0e7b?w=400&h=300&fit=crop",weight:"3-5 kg",lifespan:"12-15 años"},
  {id:"british",name:"Británico Pelo Corto",origin:"Reino Unido",type:"pelo-corto",desc:"El osito de peluche felino. Robusto, tranquilo, pelaje denso.",img:"https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?w=400&h=300&fit=crop",weight:"4-8 kg",lifespan:"14-20 años"},
  {id:"ragdoll",name:"Ragdoll",origin:"EE.UU",type:"pelo-largo",desc:"Famosos por relajarse como muñecos de trapo. Dóciles y cariñosos.",img:"https://images.unsplash.com/photo-1501820488136-72669149e0d4?w=400&h=300&fit=crop",weight:"5-9 kg",lifespan:"12-17 años"},
  {id:"scottish",name:"Scottish Fold",origin:"Escocia",type:"pelo-corto",desc:"Orejas plegadas únicas. Dulces, tranquilos y muy apegados.",img:"https://images.unsplash.com/photo-1519052537078-e6302a4968d4?w=400&h=300&fit=crop",weight:"3-6 kg",lifespan:"12-15 años"},
  {id:"abisinio",name:"Abisinio",origin:"Etiopía",type:"pelo-corto",desc:"Una de las razas más antiguas. Pelaje ticked único.",img:"https://images.unsplash.com/photo-1536590158209-e9d317d0c16f?w=400&h=300&fit=crop",weight:"3-5 kg",lifespan:"12-15 años"},
  {id:"noruego",name:"Bosque de Noruega",origin:"Noruega",type:"pelo-largo",desc:"El gato vikingo. Robusto, pelaje impermeable.",img:"https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=400&h=300&fit=crop",weight:"5-9 kg",lifespan:"14-16 años"},
];

function render() {
  var grid = document.getElementById('grid');
  var count = document.getElementById('count');
  grid.innerHTML = breeds.map(function(b) {
    return '<div class="card">' +
      '<img src="' + b.img + '" alt="' + b.name + '" onerror="this.src=\'https://cataas.com/cat?width=400&height=300\'">' +
      '<span class="badge">' + b.type + '</span>' +
      '<h3>' + b.name + '</h3>' +
      '<p>📍 ' + b.origin + '</p>' +
      '<p>' + b.desc + '</p>' +
      '<p>⚖ ' + b.weight + ' | ⏰ ' + b.lifespan + '</p>' +
    '</div>';
  }).join('');
  count.textContent = breeds.length + ' razas';
}

// Immediate render - no waiting
render();
</script>
</body>
</html>
