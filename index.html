// ============ STATE ============
let currentFilter = 'all';
let searchQuery = '';

// ============ RENDER ============
function renderBreeds() {
  var grid = document.getElementById('breedsGrid');
  var noResults = document.getElementById('noResults');
  var filtered = breeds;

  if (currentFilter !== 'all') {
    filtered = filtered.filter(function(b) {
      if (currentFilter === 'gigante') return b.tags && b.tags.indexOf('gigante') !== -1;
      if (currentFilter === 'exotico') return b.tags && b.tags.indexOf('exotico') !== -1;
      return b.type === currentFilter;
    });
  }

  if (searchQuery.trim()) {
    var q = searchQuery.toLowerCase().trim();
    filtered = filtered.filter(function(b) {
      return b.name.toLowerCase().indexOf(q) !== -1 ||
             (b.nameEng && b.nameEng.toLowerCase().indexOf(q) !== -1) ||
             b.origin.toLowerCase().indexOf(q) !== -1 ||
             b.desc.toLowerCase().indexOf(q) !== -1;
    });
  }

  document.getElementById('breedCount').textContent = filtered.length;
  document.getElementById('totalCount').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noResults.style.display = 'block';
    return;
  }

  noResults.style.display = 'none';
  
  grid.innerHTML = filtered.map(function(b) {
    var badgeClass = '';
    var badgeText = '';
    if (b.tags && b.tags.indexOf('gigante') !== -1) { badgeClass = 'badge-gigante'; badgeText = 'Gigante'; }
    else if (b.tags && b.tags.indexOf('exotico') !== -1) { badgeClass = 'badge-exotico'; badgeText = 'Exótico'; }
    else if (b.type === 'pelo-corto') { badgeClass = 'badge-corto'; badgeText = 'Pelo Corto'; }
    else if (b.type === 'pelo-largo') { badgeClass = 'badge-largo'; badgeText = 'Pelo Largo'; }
    else if (b.type === 'pelo-semilargo') { badgeClass = 'badge-semi'; badgeText = 'Pelo Semilargo'; }
    else if (b.type === 'sin-pelo') { badgeClass = 'badge-sin'; badgeText = 'Sin Pelo'; }

    return '<div class="card" onclick="openBreed('' + b.id + '')">' +
      '<div class="card-img">' +
        '<img src="' + b.img + '" alt="' + b.name + '" loading="lazy" onerror="this.onerror=null;this.src='https://cataas.com/cat?width=800&height=600&random=' + Math.floor(Math.random()*999) + ''">' +
        '<span class="card-badge ' + badgeClass + '">' + badgeText + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<h3>' + b.name + '</h3>' +
        '<p class="card-origin">📍 ' + b.origin + '</p>' +
        '<p class="card-desc">' + b.desc + '</p>' +
        '<div class="card-stats">' +
          '<div><span class="card-stat-val">' + b.weight + '</span><span class="card-stat-label">Peso</span></div>' +
          '<div><span class="card-stat-val">' + b.lifespan + '</span><span class="card-stat-label">Vida</span></div>' +
          '<div><span class="card-stat-val">' + (b.personality ? b.personality.split(',')[0] : '') + '</span><span class="card-stat-label">Personalidad</span></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ============ MODAL ============
function openBreed(id) {
  var breed = null;
  for (var i = 0; i < breeds.length; i++) {
    if (breeds[i].id === id) { breed = breeds[i]; break; }
  }
  if (!breed) return;

  var overlay = document.getElementById('modalOverlay');
  var content = document.getElementById('modalContent');
  
  content.innerHTML = 
    '<img src="' + breed.img + '" alt="' + breed.name + '" class="modal-img" onerror="this.onerror=null;this.src='https://cataas.com/cat?width=800&height=600&random=' + Math.floor(Math.random()*999) + ''">' +
    '<div class="modal-body">' +
      '<h2>' + breed.name + '</h2>' +
      '<p style="color:#6b5b8a;margin-bottom:12px">' + breed.nameEng + ' • 📍 ' + breed.origin + '</p>' +
      '<div class="modal-stats">' +
        '<div class="modal-stat"><div class="val">' + breed.weight + '</div><div class="lbl">Peso</div></div>' +
        '<div class="modal-stat"><div class="val">' + breed.lifespan + '</div><div class="lbl">Vida</div></div>' +
        '<div class="modal-stat"><div class="val">' + breed.colors.length + '</div><div class="lbl">Variedades</div></div>' +
      '</div>' +
      '<h3>📖 Descripción</h3><p>' + breed.desc + '</p>' +
      '<h3>📜 Historia</h3><p>' + breed.history + '</p>' +
      '<h3>🧠 Temperamento</h3><p>' + breed.temperament + '</p>' +
      '<h3>🎨 Colores</h3><p>' + breed.colors.join(', ') + '</p>' +
      '<h3>🏥 Cuidados</h3><p>' + breed.care + '</p>' +
    '</div>';

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeBreed() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

// Keyboard escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeBreed();
});

// Close on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeBreed();
});

// ============ FILTERS ============
var chips = document.querySelectorAll('.chip');
for (var i = 0; i < chips.length; i++) {
  chips[i].addEventListener('click', function() {
    for (var j = 0; j < chips.length; j++) chips[j].classList.remove('active');
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    renderBreeds();
  });
}

// ============ SEARCH ============
var searchEl = document.getElementById('searchInput');
if (searchEl) {
  searchEl.addEventListener('input', function(e) {
    searchQuery = e.target.value;
    renderBreeds();
  });
}

// ============ INIT ============
renderBreeds();
document.getElementById('breedCount').textContent = breeds.length;
document.getElementById('totalCount').textContent = breeds.length;
</script>
