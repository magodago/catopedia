<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test</title></head>
<body style="background:#080013;color:#e8e0ff;padding:20px;font-family:Arial">
<h1 style="color:#00d4ff">Catopedia Test</h1>
<p id="msg">Testing...</p>
<div id="grid"></div>
<script>
var el = document.getElementById('msg');
el.textContent = 'Script is running!';

var breeds = [
  {name:"Siames",origin:"Tailandia",img:"images/siames.png",desc:"Raza antigua"},
  {name:"Persa",origin:"Iran",img:"images/persa.png",desc:"Lujoso"}
];

el.textContent = breeds.length + ' breeds loaded';

var grid = document.getElementById('grid');
for (var i = 0; i < breeds.length; i++) {
  var b = breeds[i];
  var card = document.createElement('div');
  card.style.background = '#0d0020';
  card.style.border = '1px solid #1a0040';
  card.style.borderRadius = '12px';
  card.style.padding = '15px';
  card.style.margin = '10px 0';
  card.innerHTML = '<img src="' + b.img + '" style="width:100%;height:180px;object-fit:cover;border-radius:8px" alt="">' +
    '<h3 style="color:#00d4ff">' + b.name + '</h3>' +
    '<p style="color:#8b7baa">' + b.origin + '</p>' +
    '<p style="color:#8b7baa">' + b.desc + '</p>';
  grid.appendChild(card);
}

el.textContent = 'DONE! ' + breeds.length + ' breeds rendered';
</script>
</body></html>
